apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-app
  labels:
    app: sentinel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-app
  template:
    metadata:
      labels:
        app: sentinel-app
    spec:
      containers:
      - name: app
        image: sentinel-app:v7
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: app-data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: app-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-app-svc
spec:
  type: NodePort
  selector:
    app: sentinel-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
